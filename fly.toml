# fly.toml app configuration file generated for blunderfest on 2024-03-04T13:44:42Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'blunderfest'
primary_region = 'ams'
kill_signal = 'SIGTERM'

[build]

[env]
  PHX_HOST = 'blunderfest.org'
  PORT = '8080'
  # Nodes find each other over the private network (ADR-0013).
  DNS_CLUSTER_QUERY = 'blunderfest.internal'
  # SECRET_KEY_BASE and RELEASE_COOKIE live in `fly secrets` (never in the repo).

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[deploy]
  strategy = 'rolling'

[[regions]]
  region = 'ams'
  count = 1

[[regions]]
  region = 'ord'
  count = 1
