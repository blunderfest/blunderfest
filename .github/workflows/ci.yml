name: CI

on:
  push:
    branches: [main, restart]
  pull_request:

jobs:
  backend:
    name: Elixir backend
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.2'
          otp-version: '29.0.1'

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - run: mix local.hex --force && mix local.rebar --force
      - run: mix deps.get
      # echecs does not ship its magic bitboard cache; generate it before compiling
      - run: test -f deps/echecs/priv/magic_cache.bin || elixir deps/echecs/scripts/generate_magic_cache.exs
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test

  frontend:
    name: React frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: assets

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: assets/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test -- --run
      - run: pnpm build
